<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--or:#ff6a00;--bg:#0a0a0a;--wh:#f5f5f5;--glass:rgba(10,10,10,.74)}
html,body{background:var(--bg);color:var(--wh);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bg{position:fixed;inset:0;z-index:0;background:#0a0a0a url(/hi/bg.webp) center top/cover no-repeat}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,8,.30) 0%,rgba(8,8,8,.62) 24%,rgba(8,8,8,.86) 46%,rgba(8,8,8,.80) 78%,rgba(8,8,8,.62) 100%)}
main{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;justify-content:center;max-width:460px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom))}
h1{font-weight:900;text-transform:uppercase;letter-spacing:-.02em;line-height:.98;font-size:min(13.4vw,58px)}
h1 span{display:block;color:var(--or)}
.claim{margin-top:clamp(14px,2.6svh,24px);font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:-.015em;line-height:1.02;font-size:min(7vw,30px)}
.claim span{display:block;color:var(--or)}
.tag{align-self:flex-start;margin:clamp(14px,2.6svh,22px) 0 clamp(18px,3.2svh,28px);padding:8px 16px;border:2px solid var(--or);border-radius:999px;background:var(--glass);font-weight:700;font-size:12px;letter-spacing:.09em;text-transform:uppercase;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.btn{display:flex;align-items:center;gap:12px;min-height:60px;padding:12px 16px;border-radius:16px;background:var(--glass);border:2px solid var(--or);color:var(--wh);text-decoration:none;font-weight:700;font-size:16px;line-height:1.15;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.btn svg{flex:none;width:24px;height:24px;stroke:var(--or);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn small{display:block;margin-top:2px;font-weight:500;font-size:12px;color:#b4b4b4;overflow-wrap:anywhere}
.btn:active{transform:scale(.98)}
.btn.primary{min-height:68px;margin-bottom:10px;background:var(--or);border-color:var(--or);color:#0a0a0a;font-size:19px;font-weight:900;text-transform:uppercase;letter-spacing:.01em;backdrop-filter:none;-webkit-backdrop-filter:none}
.btn.primary svg{stroke:#0a0a0a;stroke-width:2.6}
.ic-call svg{stroke:#2ecc71}
.ic-wa svg{stroke:#25d366}
.ic-ig svg{stroke:url(#ig)}
.ic-ig svg circle:last-child{fill:url(#ig);stroke:none}
.ic-web svg{stroke:#ff6a00}
.ic-mail svg{stroke:#ffc400}
.ic-li svg{stroke:#2f9bff}
.ic-yt svg{stroke:#ff2a2a}
.ic-yt svg path{fill:#ff2a2a;stroke:#ff2a2a}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .wide{grid-column:1/-1}
.btn.yt{min-height:72px;font-size:18px;font-weight:900}
.btn.yt svg{width:30px;height:30px}
.btn.yt small{font-size:13px}
.foot{margin-top:16px;font-size:11px;color:#8a8a8a;text-align:center;letter-spacing:.04em}
@media (max-height:700px){.btn{min-height:52px}.btn.primary{min-height:58px}.btn.yt{min-height:62px}.tag{margin-top:12px;margin-bottom:14px}.claim{margin-top:10px}.foot{display:none}}
</style>
